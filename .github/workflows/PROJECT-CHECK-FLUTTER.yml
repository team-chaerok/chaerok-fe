name: "PROJECT-CHECK-FLUTTER"

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      - name: Inject secrets (Android)
        run: echo "kakao.nativeAppKey=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> android/local.properties

      - name: Inject secrets (iOS)
        run: echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" > ios/Flutter/Secrets.xcconfig

      - name: Inject secrets (Dart)
        run: |
          cat > lib/core/config/app_secrets.dart << 'EOF'
          class AppSecrets {
            const AppSecrets._();
            static const String baseUrl = '${{ secrets.BASE_URL }}';
            static const String kakaoNativeAppKey = '${{ secrets.KAKAO_NATIVE_APP_KEY }}';
            static const String kakaoRestApiKey = '${{ secrets.KAKAO_REST_API_KEY }}';
            static const String kmaServiceKey = '${{ secrets.KMA_SERVICE_KEY }}';
            static const String googleClientId = '${{ secrets.GOOGLE_CLIENT_ID }}';
            static const String googleServerClientId = '${{ secrets.GOOGLE_SERVER_CLIENT_ID }}';
          }
          EOF
          dart format lib/core/config/app_secrets.dart

      - name: Guard - no Test Mode flag in prod config
        run: |
          if grep -q "CHAEROK_TEST_MODE" config/prod.json; then
            echo "config/prod.json 에 CHAEROK_TEST_MODE 가 있으면 안 됩니다 (정식 빌드에 Test Mode 유입)."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze
